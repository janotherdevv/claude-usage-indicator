[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "claude-usage-watcher"
version = "0.1.0"
description = "Shows Claude API usage in the system tray"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
authors = [
    { name = "Janotherdev" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
]
dependencies = []  # PyGObject and pycairo come from system packages (python3-gi, python3-cairo)

[project.scripts]
claude-usage-watcher = "watcher.tray:main"

[tool.hatch.build.targets.wheel]
packages = ["watcher"]

[tool.hatch.build]
include = [
  "watcher/**/*.css",
  "watcher/**/*.svg",
]
